name: Build Exe

on:
  push:
    branches: [ "asosiy", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-docx pandas openpyxl pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --noconsole --onedir --add-data "templates;templates" --name "qarz_nazorat" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: QarzNazorat-EXE
        path: dist/qarz_nazorat/
